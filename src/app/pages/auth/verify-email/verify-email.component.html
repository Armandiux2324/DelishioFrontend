<main [attr.lang]="language()">
  @let text = t();
  <header class="top">
    <a class="brand" routerLink="/login">Delishio</a>
    <label class="d-field">{{ text.language }}
      <select class="d-select" [disabled]="state.busy()" [ngModel]="language()" (ngModelChange)="language.set($event)">
        <option value="es">Español</option><option value="en">English</option>
      </select>
    </label>
  </header>
  <app-panel><div class="content">
    <h1>{{ text.verifyEmail }}</h1>
    <p class="hint">{{ text.verifyHint }}</p>
    <app-form-feedback id="account-feedback" [state]="state" [english]="language() === 'en'" />
    @if (!verified()) {
      <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="state.busy()">
      <label class="d-field" for="email">{{ text.email }}
        <input class="d-input" id="email" name="email" type="email" formControlName="email"
          [attr.aria-invalid]="(form.controls.email.invalid && form.controls.email.touched) || !!state.error()?.fields?.['email']"
          aria-describedby="account-feedback" required maxlength="255" autocomplete="email">
      </label>
      <label class="d-field" for="code">{{ text.code }}
        <input class="d-input" id="code" name="code" type="text" formControlName="code"
          [attr.aria-invalid]="(form.controls.code.invalid && form.controls.code.touched) || !!state.error()?.fields?.['code']"
          aria-describedby="account-feedback" required pattern="[0-9]{6}" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
      </label>
      @if (form.invalid && form.touched) { <p class="d-field-error" role="alert">{{ text.invalidForm }}</p> }
        <button dButton type="submit" [disabled]="state.busy()">{{ text.verify }}</button>
        <button dButton variant="secondary" type="button" [disabled]="state.busy()" (click)="resend()">{{ text.resend }}</button>
      </form>
    }
  </div></app-panel>
  <nav><a routerLink="/login" [state]="{ locale: language() }">{{ text.backToLogin }}</a></nav>
</main>
