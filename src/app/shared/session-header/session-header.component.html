@let english = session.user?.locale === 'en';
<header [class.compact]="compact">
  <div class="brand">
    @if (!compact) { <strong>Delishio</strong> }
    <span class="area">{{ area }}</span>
  </div>
  <div class="account">
    <a class="profile-link" routerLink="/profile" [attr.aria-label]="english ? 'My profile' : 'Mi perfil'">
      <svg lucideIcon="user-round" [size]="18" aria-hidden="true"></svg>
      <span class="name">{{ (session.session$ | async)?.user?.name }}</span>
    </a>
    <button dButton variant="ghost" type="button" [disabled]="busy()" (click)="logout()" [attr.aria-busy]="busy()">
      <svg lucideIcon="log-out" [size]="18" aria-hidden="true"></svg>
      <span>{{ english ? 'Sign out' : 'Cerrar sesión' }}</span>
    </button>
  </div>
</header>
@if (failed()) {
  <app-feedback kind="error" [message]="english ? 'Unable to sign out. Try again.' : 'No se pudo cerrar la sesión. Inténtalo de nuevo.'" />
}
